---
layout: default
---
<section class="page">
    {% if page.pdf_button %}
    <div class="page-header">
        <h1>{{ page.title }}</h1>
        <a class="page-header-button" href="{{ site.data.cv.pdf_url }}" target="_blank" rel="noopener">Download PDF</a>
    </div>
    {% else %}
    <h1>{{ page.title }}</h1>
    {% endif %}
    {{ content }}
</section>
